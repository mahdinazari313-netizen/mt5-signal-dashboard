name: Build and Publish APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        run: gradle :app:assembleDebug
      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk MT5SignalDashboard.apk
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MT5SignalDashboard-installable
          path: MT5SignalDashboard.apk
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          gh release create "$TAG" MT5SignalDashboard.apk --title "MT5 Signal Dashboard $TAG" --notes "Installable Android APK built from main." --target "${{ github.sha }}"
