name: Build and Publish APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build universal installable APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Verify APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          file app/build/outputs/apk/debug/app-debug.apk
          unzip -t app/build/outputs/apk/debug/app-debug.apk >/dev/null
      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk MT5SignalDashboard.apk
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MT5SignalDashboard-installable
          path: MT5SignalDashboard.apk
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.1.${{ github.run_number }}"
          gh release create "$TAG" MT5SignalDashboard.apk \
            --title "MT5 Signal Dashboard $TAG" \
            --notes "Direct-install Android APK. Universal debug build, verified as a valid APK archive." \
            --target "${{ github.sha }}" \
            --latest
